<!DOCTYPE html>
<html>

<head>
    <title>Student Performance Prediction</title>
</head>

<body>

<div class="login">

    <h1>Student Exam Performance Indicator</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <h2>Student Exam Performance Prediction</h2>


        <label>Gender</label>

        <select name="gender" required>

            <option selected disabled value="">
                Select your Gender
            </option>

            <option value="male">
                Male
            </option>

            <option value="female">
                Female
            </option>

        </select>

        <br><br>


        <label>Race or Ethnicity</label>

        <select name="ethnicity" required>

            <option selected disabled value="">
                Select Ethnicity
            </option>

            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>

        </select>

        <br><br>


        <label>Parental Level of Education</label>

        <select name="parental_level_of_education" required>

            <option selected disabled value="">
                Select Parent Education
            </option>

            <option value="associate's degree">
                Associate's Degree
            </option>

            <option value="bachelor's degree">
                Bachelor's Degree
            </option>

            <option value="high school">
                High School
            </option>

            <option value="master's degree">
                Master's Degree
            </option>

            <option value="some college">
                Some College
            </option>

            <option value="some high school">
                Some High School
            </option>

        </select>

        <br><br>


        <label>Lunch Type</label>

        <select name="lunch" required>

            <option selected disabled value="">
                Select Lunch Type
            </option>

            <option value="free/reduced">
                Free/Reduced
            </option>

            <option value="standard">
                Standard
            </option>

        </select>

        <br><br>


        <label>Test Preparation Course</label>

        <select name="test_preparation_course" required>

            <option selected disabled value="">
                Select Test Course
            </option>

            <option value="none">
                None
            </option>

            <option value="completed">
                Completed
            </option>

        </select>

        <br><br>


        <label>Reading Score out of 100</label>

        <input
            type="number"
            name="reading_score"
            placeholder="Enter Reading Score"
            min="0"
            max="100"
            required
        >

        <br><br>


        <label>Writing Score out of 100</label>

        <input
            type="number"
            name="writing_score"
            placeholder="Enter Writing Score"
            min="0"
            max="100"
            required
        >

        <br><br>


        <input
            type="submit"
            value="Predict Maths Score"
        >

    </form>


    {% if results is defined %}

        <hr>

        <h2>
            Predicted Mathematics Score: {{ results }}
        </h2>

        <h3>
            Performance Level: {{ performance_level }}
        </h3>

        <p>
            <b>Recommendation:</b>
            {{ recommendation }}
        </p>

    {% endif %}


    <br>

    <a href="/">
        Go back to Home
    </a>

</div>

</body>
</html>
